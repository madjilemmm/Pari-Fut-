databases:
  - name: pari-fute-db
    plan: free
    databaseName: pari_fute
    user: pari_fute

services:
  - type: web
    name: pari-fute-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pari-fute-db
          property: connectionString
    healthCheckPath: /health
